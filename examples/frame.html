<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Frame</title>
	<style>
		body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #111827; background: #fff; }
		.bar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; border-bottom: 1px solid #e5e7eb; }
		.list { height: 420px; overflow: auto; }
		.row { display: flex; gap: 0.75rem; padding: 0.75rem 1.25rem; border-bottom: 1px solid #f3f4f6; }
		.dot { width: 2rem; height: 2rem; border-radius: 50%; background: #c7d2fe; flex: none; }
		button { font: inherit; padding: 0.35rem 0.8rem; border-radius: 6px; border: 0; background: #4f46e5; color: #fff; }
	</style>
</head>
<body>
	<div class="bar"><h1 id="title" style="font-size:1.1rem;margin:0">Inbox</h1><button>Compose</button></div>
	<div class="list" id="list"></div>
	<script>
		const name = new URLSearchParams(location.search).get('name') ?? 'Inbox';
		document.getElementById('title').textContent = name;
		const list = document.getElementById('list');
		for (let i = 1; i <= 30; i++) {
			const row = document.createElement('div');
			row.className = 'row';
			row.innerHTML = `<span class="dot"></span><div><strong>Message ${i}</strong><p style="margin:0">A line of text in ${name.toLowerCase()} number ${i}.</p></div>`;
			list.append(row);
		}
	</script>
</body>
</html>
