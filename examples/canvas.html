<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Canvas – visual-comments example</title>
	<style>
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, sans-serif; background: #1c1917; color: #e7e5e4; overflow: hidden; }
		.toolbar { display: flex; gap: 0.5rem; align-items: center; padding: 0.5rem 0.75rem; }
		.island { display: flex; gap: 2px; align-items: center; padding: 4px; border-radius: 999px; background: rgb(50 50 50 / 0.57); color: #fff; }
		.tool { height: 2rem; min-width: 2rem; padding: 0 0.75rem; border: 0; border-radius: 999px; background: none; color: inherit; font: inherit; position: relative; }
		.tool:hover { background: rgb(255 255 255 / 0.12); }
		.tool[aria-pressed='true'] { background: #fff; color: #292524; }
		.tool[data-vc-unread]::after { content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: #0d99ff; }
		.stage { position: relative; flex: 1; overflow: hidden; display: flex; }
		.viewport { position: relative; flex: 1; overflow: hidden; touch-action: none; }
		.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
		.frame { position: absolute; width: 640px; height: 480px; background: #fff; overflow: hidden; }
		.frame iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
		.label { position: absolute; color: #a8a29e; font-size: 12px; }
		[data-vc-panel] { width: 320px; margin: 12px; }
	</style>
	<script src="{{SERVER}}/v1/visual-comments.js" data-space="demo" data-page="canvas-example" defer></script>
</head>
<body>
	<div class="toolbar">
		<a href="./" style="color:inherit">← Plain page</a>
		<span style="flex:1"></span>
		<div class="island">
			<button class="tool" data-vc-toggle title="Comments (C)">Comments</button>
			<span data-vc-account></span>
		</div>
	</div>
	<div class="stage">
		<div class="viewport" id="viewport" data-vc-gestures="host">
			<div class="board" id="board"></div>
		</div>
	</div>
	<script>
		// A board of frames that pans when dragged and zooms with the wheel, like paraframe's canvas.
		const frames = [['inbox', 'Inbox'], ['archive', 'Archive'], ['drafts', 'Drafts'], ['sent', 'Sent']];
		const board = document.getElementById('board');
		frames.forEach(([id, title], i) => {
			const x = (i % 2) * 720, y = Math.floor(i / 2) * 560;
			board.insertAdjacentHTML('beforeend', `
				<p class="label" style="left:${x}px;top:${y - 22}px">${title}</p>
				<div class="frame" style="left:${x}px;top:${y}px" data-vc-surface="${id}" data-vc-title="${title}">
					<iframe data-vc-frame src="./frame.html?name=${encodeURIComponent(title)}" title="${title}"></iframe>
				</div>`);
		});
		const viewport = document.getElementById('viewport');
		const camera = { x: 40, y: 40, z: 0.6 };
		const apply = () => { board.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.z})`; };
		apply();
		viewport.addEventListener('wheel', (event) => {
			event.preventDefault();
			const rect = viewport.getBoundingClientRect();
			if (event.ctrlKey || event.metaKey) {
				const z = Math.min(4, Math.max(0.1, camera.z * Math.exp(-event.deltaY * 0.01)));
				const px = event.clientX - rect.left, py = event.clientY - rect.top;
				camera.x = px - (px - camera.x) * (z / camera.z);
				camera.y = py - (py - camera.y) * (z / camera.z);
				camera.z = z;
			} else {
				camera.x -= event.deltaX;
				camera.y -= event.deltaY;
			}
			apply();
		}, { passive: false });
		let drag;
		viewport.addEventListener('pointerdown', (event) => {
			drag = { x: event.clientX - camera.x, y: event.clientY - camera.y };
			viewport.setPointerCapture(event.pointerId);
		});
		viewport.addEventListener('pointermove', (event) => {
			if (!drag) return;
			camera.x = event.clientX - drag.x;
			camera.y = event.clientY - drag.y;
			apply();
		});
		viewport.addEventListener('pointerup', () => { drag = undefined; });

		// The list takes a column of the stage while comment mode is on, so frames stay clear of it.
		addEventListener('load', () => {
			const panel = document.createElement('div');
			panel.setAttribute('data-vc-panel', '');
			window.visualComments?.subscribe((vc) => {
				if (vc.active && !panel.isConnected) document.querySelector('.stage').append(panel);
				if (!vc.active) panel.remove();
			});
			// Zoom to a thread's frame when it is opened from the list.
			window.visualComments?.configure({
				show(thread) {
					const frame = document.querySelector(`[data-vc-surface="${thread.surface}"]`);
					if (!frame) return false;
					camera.z = 1;
					camera.x = 40 - frame.offsetLeft;
					camera.y = 40 - frame.offsetTop;
					apply();
					return true;
				}
			});
		});
	</script>
</body>
</html>
